# Checks every pull request and every push to main: lint, types, tests and the UI build.
#
# linkstead deploys nowhere from here. An installation deploys from its own repository or
# machine, pinned to a release of this one (README, "Running your own").
#
# The actions run on Node 24 (checkout v7, setup-node v7, pnpm/action-setup v6); the project's own
# Node is whatever mise.toml names.

name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          # The same Node as on a developer's machine: mise.toml says which.
          node-version-file: mise.toml
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/biome check .
      - run: ./node_modules/.bin/tsc --noEmit
      - run: ./node_modules/.bin/tsc --noEmit -p src/ui
      - run: ./node_modules/.bin/vitest run
      - run: ./node_modules/.bin/vite build --config src/ui/vite.config.ts
