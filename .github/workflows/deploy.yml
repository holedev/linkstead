# Checks every pull request, and deploys main to Cloudflare once the same checks pass.
#
# A broken Worker takes every printed QR down with it (ADR-0001), so nothing is deployed that has
# not passed lint, types and the tests first. Migrations go to the trial database before the new
# Worker does: they only ever add, so the running Worker keeps working against them meanwhile.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - a token that may edit Workers and D1 on the account
#   CLOUDFLARE_ACCOUNT_ID - the account the Worker lives in

name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]

# One deploy at a time, in order; a newer push waits rather than racing an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/biome check .
      - run: ./node_modules/.bin/tsc --noEmit
      - run: ./node_modules/.bin/tsc --noEmit -p src/ui
      - run: ./node_modules/.bin/vitest run
      - run: ./node_modules/.bin/vite build --config src/ui/vite.config.ts

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/vite build --config src/ui/vite.config.ts
      - name: Apply migrations to the trial database
        run: ./node_modules/.bin/wrangler d1 migrations apply ou-link --remote
      - name: Deploy the Worker
        run: ./node_modules/.bin/wrangler deploy
